name: BTMath backend tests

on:
  push:
    branches:
      - main
      - fix/production-security-and-access
  pull_request:
    branches:
      - main

jobs:
  django-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-only-secret-key-not-for-production"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
      DEFAULT_FROM_EMAIL: "BTMath <test@btmath.local>"
      FRONTEND_URL: "https://btmath.example"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run education tests
        run: python manage.py test education --verbosity 2
