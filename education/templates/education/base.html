<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}BTMath Education Portal{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        nav {
            background: #1e293b;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        nav ul {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        nav ul a {
            color: white;
            text-decoration: none;
        }

        nav ul a:hover {
            color: #38bdf8;
        }

        .container {
            width: 84%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .hero {
            background: white;
            padding: 60px 40px;
            text-align: center;
            border-radius: 15px;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            color: #64748b;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            color: #64748b;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            border-radius: 7px;
            text-decoration: none;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .course-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .course-card h3 {
            margin-bottom: 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
        }

        .chapter {
            background: white;
            margin-bottom: 20px;
            padding: 25px;
            border-radius: 10px;
        }

        .material {
            padding: 12px;
            margin-top: 10px;
            background: #f1f5f9;
            border-radius: 6px;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: 1fr 1fr;
            }

            nav {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="{% url 'home' %}" class="logo">
        BTMath 
    </a>

    <ul>
        <li><a href="{% url 'home' %}">Home</a></li>

        <li>
            <a href="{% url 'category_courses' 'plus2' %}">
                +2
            </a>
        </li>

        <li>
            <a href="{% url 'category_courses' 'bachelor' %}">
                Bachelor
            </a>
        </li>

        <li>
            <a href="{% url 'category_courses' 'master' %}">
                Master
            </a>
        </li>

        <li>
            <a href="{% url 'category_courses' 'ioe' %}">
                IOE
            </a>
        </li>

    
    </ul>
</nav>

<div class="container">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
